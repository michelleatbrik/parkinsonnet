name: parkinsontrainingscentrum
type: craftcms
docroot: public_html
php_version: "8.2"
webserver_type: nginx-fpm
xdebug_enabled: false

additional_hostnames:
  - praktijkdriebergen
  - oefentherapeut

additional_fqdns: []

database:
  type: mysql
  version: "8.0"

use_dns_when_possible: true
composer_version: "2"
web_environment: []
nodejs_version: "22"
corepack_enable: true
ddev_version_constraint: ">= 1.24.4"
webimage_extra_packages: [ffmpeg]

web_extra_daemons:
  - name: "craft-queue"
    command: "/var/www/html/craft queue/listen"
    directory: /var/www/html